name: ALM6 Interview Simulator QA

on:
  push:
    paths:
      - 'apps/alm6-interview-simulator/**'
      - 'learning/interview-preparation/ALM6/scale-lab/**'
      - '.github/workflows/alm6-simulator-qa.yml'
  pull_request:
    paths:
      - 'apps/alm6-interview-simulator/**'
      - 'learning/interview-preparation/ALM6/scale-lab/**'
      - '.github/workflows/alm6-simulator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-static-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ALM6 smoke and source-ingestion tests
        run: node --test apps/alm6-interview-simulator/tests/smoke.test.mjs
