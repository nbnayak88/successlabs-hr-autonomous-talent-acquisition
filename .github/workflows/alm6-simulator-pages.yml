name: Publish ALM6 Interview Simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/alm6-interview-simulator/**'
      - 'learning/interview-preparation/ALM6/scale-lab/**'
      - '.github/workflows/alm6-simulator-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static simulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/alm6-interview-simulator
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
